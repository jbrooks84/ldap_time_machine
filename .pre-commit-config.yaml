# Install with:  pre-commit install
# Run over everything once:  pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: debug-statements
      # A committed private key is the one mistake you cannot take back by
      # amending; the history keeps it.
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # There is no CI on this repository, so these local hooks are the only thing
  # that runs the gates without someone remembering to.
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest
        language: system
        pass_filenames: false
        types: [python]

      - id: doc-links
        name: check documentation links
        entry: python .github/check_doc_links.py
        language: system
        pass_filenames: false
        files: \.md$
