# LDAP Time Machine — credentials
#
# Copy to ~/.config/ldap-time-machine/credentials.yml and chmod 0600.
# Keep it out of the repository. The .gitignore already refuses to track
# credentials.yml, but the safest copy is the one that never lives here.
#
#   mkdir -p ~/.config/ldap-time-machine
#   cp credentials.example.yml ~/.config/ldap-time-machine/credentials.yml
#   chmod 600 ~/.config/ldap-time-machine/credentials.yml
#
# Every value can be overridden by an LTM_-prefixed environment variable
# (LTM_LDAP_PASSWORD, LTM_SMTP_PASSWORD, ...), which takes precedence over
# this file. That is how to inject secrets from a secret manager or CI
# without writing them to disk.

# ── Directory bind ────────────────────────────────────────────────
# Use a dedicated read-only service account, not a person's account. A
# personal account ties the job to someone's employment and to their password
# rotation; both eventually end the job without warning.
#
# Active Directory accepts a UPN (svc-ldap-reader@example.com) or a full bind
# DN. OpenLDAP wants the DN.
LDAP_USERNAME: svc-ldap-reader@example.com
LDAP_PASSWORD: "change-me"

# ── Email delivery ────────────────────────────────────────────────
SMTP_SERVER: smtp.example.com
SMTP_PORT: 25

# Prefer a shared mailbox over a personal address, for the same reason.
FROM_EMAIL: ldap-time-machine@example.com

# Comma-separated. A distribution list beats a list of individuals.
TO_EMAIL: directory-reports@example.com

# Master switch. Set to false to run the whole pipeline and archive the
# rendered report without sending anything.
SEND_EMAIL: true

# ── Optional SMTP authentication ──────────────────────────────────
# An internal relay on port 25 usually needs neither. Anything else does.
# SMTP_USE_TLS: true          # negotiate STARTTLS after connecting
# SMTP_USERNAME: ldap-time-machine@example.com
# SMTP_PASSWORD: "change-me"
