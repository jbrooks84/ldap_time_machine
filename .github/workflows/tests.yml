name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the project supports; keep it in the matrix so a
        # newer-syntax regression is caught here rather than on someone's
        # long-lived server.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite substitutes its own ldapsearch on PATH, so the real client
      # is not needed. Installing it anyway proves the tests are not quietly
      # depending on its absence.
      - name: Install LDAP client
        run: sudo apt-get update && sudo apt-get install -y ldap-utils

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: pytest --cov=ltm --cov-report=term-missing

  # AGENTS.md sends contributors — human and agent — to a specific page and
  # heading before they touch a module. A link that no longer resolves sends
  # them to generic assumptions instead, so docs rot fails the PR.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check documentation links
        run: python .github/check_doc_links.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
